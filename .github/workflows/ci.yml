name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install repository pnpm
        run: npm install --global pnpm@10.29.3
      - name: Validate shared contracts and fixtures
        run: node scripts/validate-shared-contracts.mjs
      - name: Install locked web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Lint web
        working-directory: web
        run: pnpm lint
      - name: Test web
        working-directory: web
        run: pnpm test
      - name: Type-check web
        working-directory: web
        run: pnpm typecheck
      - name: Build web
        working-directory: web
        run: pnpm build
      - name: Audit production dependencies
        working-directory: web
        run: pnpm audit --prod --audit-level=high
      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run web acceptance tests
        working-directory: web
        run: pnpm test:e2e
