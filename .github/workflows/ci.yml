name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate shared contracts and fixtures
        run: node scripts/validate-shared-contracts.mjs

  native:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Build native release
        if: ${{ hashFiles('macos/Package.swift', 'macos/**/*.xcodeproj/project.pbxproj') != '' }}
        run: scripts/build-macos.sh
      - name: Run Swift tests
        if: ${{ hashFiles('macos/Package.swift') != '' }}
        run: swift test --package-path macos

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: ${{ hashFiles('web/package.json') != '' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked web dependencies
        if: ${{ hashFiles('web/package-lock.json') != '' }}
        working-directory: web
        run: npm ci
      - name: Lint web
        if: ${{ hashFiles('web/package.json') != '' }}
        working-directory: web
        run: npm run lint --if-present
      - name: Test web
        if: ${{ hashFiles('web/package.json') != '' }}
        working-directory: web
        run: npm test --if-present
      - name: Build web
        if: ${{ hashFiles('web/package.json') != '' }}
        working-directory: web
        run: npm run build --if-present
