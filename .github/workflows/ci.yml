name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate shared contracts and fixtures
        run: node scripts/validate-shared-contracts.mjs

  native:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Build native release
        if: ${{ hashFiles('macos/Package.swift', 'macos/**/*.xcodeproj/project.pbxproj') != '' }}
        run: scripts/build-macos.sh
      - name: Run Swift tests
        if: ${{ hashFiles('macos/Package.swift') != '' }}
        run: swift test --package-path macos

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: ${{ hashFiles('web/package.json') != '' }}
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Enable repository pnpm
        if: ${{ hashFiles('web/package.json') != '' }}
        run: corepack enable
      - name: Install locked web dependencies
        if: ${{ hashFiles('web/pnpm-lock.yaml') != '' }}
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Lint web
        if: ${{ hashFiles('web/package.json') != '' }}
        working-directory: web
        run: pnpm lint
      - name: Test web
        if: ${{ hashFiles('web/package.json') != '' }}
        working-directory: web
        run: pnpm test
      - name: Type-check web
        if: ${{ hashFiles('web/package.json') != '' }}
        working-directory: web
        run: pnpm typecheck
      - name: Build web
        if: ${{ hashFiles('web/package.json') != '' }}
        working-directory: web
        run: pnpm build
      - name: Install Chromium
        if: ${{ hashFiles('web/playwright.config.ts') != '' }}
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run web acceptance tests
        if: ${{ hashFiles('web/playwright.config.ts') != '' }}
        working-directory: web
        run: pnpm test:e2e
