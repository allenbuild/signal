name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Validate project and scripts
        run: |
          plutil -lint Signal.xcodeproj/project.pbxproj
          plutil -lint Signal/Resources/Info.plist
          plutil -lint Signal/Resources/Signal.entitlements
          bash -n scripts/build-native-signal.sh scripts/package-native-signal.sh
          git diff --check
      - name: Build native Signal
        run: |
          xcodebuild \
            -project Signal.xcodeproj \
            -scheme Signal \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .derivedData \
            ARCHS=arm64 \
            build \
            CODE_SIGNING_ALLOWED=NO
      - name: Test native Signal
        run: |
          xcodebuild \
            -project Signal.xcodeproj \
            -scheme Signal \
            -destination 'platform=macOS' \
            -derivedDataPath .derivedData \
            test \
            CODE_SIGNING_ALLOWED=NO
      - name: Package one native application
        run: ./scripts/package-native-signal.sh
      - name: Verify package boundary
        run: |
          test "$(plutil -extract CFBundleIdentifier raw -o - \
            artifacts/native/Signal.app/Contents/Info.plist)" = com.allenxu.Signal
          test "$(lipo -archs artifacts/native/Signal.app/Contents/MacOS/Signal)" = arm64
          test -z "$(find artifacts/native/Signal.app/Contents -mindepth 1 \
            \( -iname '*.app' -o -iname '*.appex' -o -iname '*.xpc' \
               -o -iname '*.xctest' -o -iname '*helper*' \) -print -quit)"
          unzip -t artifacts/native/Signal-local.zip
      - name: Upload native Signal
        uses: actions/upload-artifact@v4
        with:
          name: signal-native-local
          path: |
            artifacts/native/Signal.app
            artifacts/native/Signal-local.zip
          if-no-files-found: error
